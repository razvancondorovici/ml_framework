# ResNet-50 Classification Configuration
# Example configuration for image classification with ResNet-50
# Work in Progress
experiment:
  name: kfold_validation
  seed: 42

data:
  dataset_type: binary_classification
  test_data_txt: /media/andra/Extreme Pro/CerviAssistAI/tablouri/out_crops/txt_files/
  checkpoint: /home/andra/Documents/ml_framework/runs/efficientnet_classification/20251030_103746/checkpoints/best.pt
  num_classes: 2
  class_names: ['normal', 'suspecte']

dataloader:
  batch_size: 32
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  backbone: timm_efficientnet_b0

metrics:
  task: binary
  num_classes: 10
  average: macro

callbacks:
  checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 3
    enabled: true

  sample_visualizer:
    num_samples: 16
    save_every_n_epochs: 5
    enabled: true

  confusion_matrix:
    save_every_n_epochs: 10
    enabled: true

transforms:
  resize: 224
  horizontal_flip: false
  color_jitter: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  use_albumentations: false
