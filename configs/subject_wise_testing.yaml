# ResNet-50 Classification Configuration
# Example configuration for image classification with ResNet-50
# Work in Progress
experiment:
  name: kfold_validation
  seed: 42

data:
  dataset_type: binary_classification
  test_data_txt: /media/andra/Extreme Pro/CerviAssistAI/generating_once_again/out_crops/txt_files
  checkpoint: /home/andra/Documents/ml_framework/runs/kfold_training/20251118_124415/fold_training_3.txt/checkpoints/best.pt
  num_classes: 2

dataloader:
  batch_size: 64
  num_workers: 0

  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  backbone: timm_efficientnet_b0
  dropout: 0.3

metrics:
  task: binary
  num_classes: 2
  average: macro

callbacks:
  checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 3
    enabled: true

  sample_visualizer:
    num_samples: 16
    save_every_n_epochs: 5
    enabled: true

  confusion_matrix:
    save_every_n_epochs: 10
    enabled: true

transforms:
  resize: 224
  grayscale: false
  horizontal_flip: false
  color_jitter: false
  clahe: false
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  use_albumentations: true
