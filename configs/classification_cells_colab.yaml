# EfficientNet-B0 Classification Configuration for Google Colab
# Example configuration for image classification with EfficientNet-B0 on Colab GPU

experiment:
  name: tmp_test_val
  seed: 42

data:
  dataset_type: classification
  # Update these paths to match your Colab setup:
  # Option 1: Google Drive (recommended for large datasets)
  # train_data_dir: /content/drive/MyDrive/datasets/herlev_grouped/train
  # Option 2: Uploaded directly to Colab
  # train_data_dir: /content/datasets/herlev_grouped/train
  
  # Example with multiple directories (update paths as needed):
  train_data_dir:
    - /content/drive/MyDrive/Facultate/CerviAssist/databases/CellsClassification/2025_11_03/all/herlev_grouped/train
  val_data_dir:
    - /content/drive/MyDrive/Facultate/CerviAssist/databases/CellsClassification/2025_11_03/all/sipakmed_grouped_per_subject/val
  test_data_dir:  # Optional
    - /content/drive/MyDrive/Facultate/CerviAssist/databases/CellsClassification/2025_11_03/all/herlev_grouped/test
  num_classes: 2
  class_names: ['normal', 'suspecte']

dataloader:
  batch_size: 256  # Good for T4 GPU, reduce to 16 if OOM
  num_workers: 16
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  backbone: timm_efficientnet_b0
  pretrained: true
  freeze_backbone: false
  dropout: 0.2

loss:
  name: focal
  alpha: 1.0
  gamma: 2.0

optimizer:
  name: adamw
  lr: 1e-3
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  name: cosine_warmup
  warmup_epochs: 10
  total_epochs: 101  # Reduced for Colab session limits
  min_lr: 1e-6

training:
  epochs: 10  
  amp: true  # Mixed precision for GPU
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

metrics:
  task: multiclass
  num_classes: 2
  average: macro

callbacks:
  checkpoint:
    monitor: accuracy_macro
    mode: max
    save_top_k: 3  # Reduced to save space
    enabled: true
  
  early_stopping:
    monitor: accuracy_macro
    mode: max
    patience: 15  # Adjusted for Colab
    enabled: true
  
  sample_visualizer:
    num_samples: 8
    save_every_n_epochs: 5
    enabled: true
  
  confusion_matrix:
    save_every_n_epochs: 10
    enabled: true
  
  learning_rate:
    save_every_n_epochs: 5
    enabled: true
  
  accuracy_curves:
    save_every_n_epochs: 2
    enabled: true
    title: "Accuracy Progress"

transforms:
  resize: 224
  horizontal_flip: true
  vertical_flip: false
  rotation: 15
  color_jitter: true
  hue_saturation_value: true
  gaussian_noise: true
  cutout: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  use_albumentations: true

