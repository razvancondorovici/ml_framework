# Fine-tuning Configuration for Small Segmentation Dataset (CPU Training)
# Optimized for small dataset (15 images) with CPU training

experiment:
  name: segmentation_full_markers_thermal
  seed: 42

data:
  dataset_type: segmentation
  train_data_dir: c:\Facultate\MelanoDet\segmented_markers\thermal\train\images #/kaggle/input/melanodet-markerssegmentation/dataset/train/images
  train_mask_dir: c:\Facultate\MelanoDet\segmented_markers\thermal\train\masks #/kaggle/input/melanodet-markerssegmentation/dataset/train/masks
  val_data_dir: c:\Facultate\MelanoDet\segmented_markers\thermal\val\images #/kaggle/input/melanodet-markerssegmentation/dataset/val/images
  val_mask_dir: c:\Facultate\MelanoDet\segmented_markers\thermal\val\masks #/kaggle/input/melanodet-markerssegmentation/dataset/val/masks
  test_data_dir: c:\Facultate\MelanoDet\segmented_markers\thermal\test\images  # Optional
  test_mask_dir: c:\Facultate\MelanoDet\segmented_markers\thermal\test\masks  # Optional
  num_classes: 2  # Background and markers (binary segmentation)
  class_names: ['background', 'markers']
  mask_format: 'indexed'

dataloader:
  batch_size: 2     # Small batch size for CPU and small dataset
  num_workers: 0    # Use 0 for CPU training to avoid multiprocessing issues
  pin_memory: false # Disable for CPU
  persistent_workers: false
  prefetch_factor: 2
  drop_last: true   # Drop the last incomplete batch to avoid size 1 batches

model:
  backbone: smp_deeplabv3plus_resnet50
  pretrained: true
  freeze_backbone: false  # Fine-tune the entire model
  in_channels: 3
  # DeepLabV3Plus specific parameters
  encoder_output_stride: 8
  encoder_depth: 5
  decoder_channels: 256
  upsampling: 4
  auxiliary_loss: true

loss:
  name: combined
  ce_weight: 0.1
  dice_weight: 1.0
  focal_weight: 0.5
  lovasz_weight: 0.3
  tversky_weight: 0.2
  ignore_index: 255

optimizer:
  name: adamw
  lr: 5e-5  # Lower learning rate for fine-tuning
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  backbone_lr: 1e-4
  head_lr: 3e-4

scheduler:
  name: cosine_warmup
  warmup_epochs: 5
  total_epochs: 250
  min_lr: 1e-6

training:
  epochs: 250
  amp: false        # Disable AMP for CPU training
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 4  # Accumulate gradients to simulate larger batch size

metrics:
  task: segmentation
  num_classes: 2
  ignore_index: 255
  threshold: 0.5

callbacks:
  checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 1    # Reduced to save space (was 3)
    enabled: true
    save_last: true
    save_best: true
  
  early_stopping:
    monitor: val_loss
    mode: min
    patience: 20      # Reduced patience for faster convergence (was 10)
    enabled: true
  
  sample_visualizer:
    num_samples: 4
    save_every_n_epochs: 10  # Less frequent to save time (was 5)
    enabled: true
  
  confusion_matrix:
    save_every_n_epochs: 100  # Less frequent to save time (was 5)
    enabled: true
  
  learning_rate:
    save_every_n_epochs: 10  # Less frequent to save time (was 5)
    enabled: true
  
  loss_curves:
    save_every_n_epochs: 5   # Save loss curves every 5 epochs
    enabled: true
    title: "Segmentation Training Progress"

transforms:
  resize: 512      # Larger input size for DeepLabV3Plus (minimum recommended)
  horizontal_flip: true
  vertical_flip: false
  rotation: 15
  shift_scale_rotate: true
  elastic_transform: false  # Disable heavy augmentations
  grid_distortion: false
  color_jitter: true
  gaussian_noise: false
  gaussian_blur: false
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  use_albumentations: true
