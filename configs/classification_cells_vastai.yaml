# EfficientNet-B0 Classification Configuration
# Example configuration for image classification with EfficientNet-B0

experiment:
  name: 21_train_sipakmed_herlev_val_sante_hue_saturation_value
  seed: 42

data:
  dataset_type: classification
  # Can be a single directory (string) or a list of directories (will be merged)
  # Example with single directory:
  # train_data_dir: c:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\small\train
  # Example with multiple directories:
  # train_data_dir:
  #   - c:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\small\train
  #   - c:\Facultate\CerviAssist\CellsClassification\Dataset\another\dataset\train
  train_data_dir:
    - /workspace/data/herlev_grouped/train
    - /workspace/data/sipakmed_grouped_per_subject/train
    # - /workspace/data/sante_split/train
  val_data_dir:
    # - /workspace/data/herlev_grouped/val
    # - /workspace/data/sipakmed_grouped_per_subject/val
    - /workspace/data/sante_split/val
  num_classes: 2
  class_names: ['normal', 'suspecte']

dataloader:
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  backbone: timm_efficientnet_b0
  pretrained: true
  freeze_backbone: false
  dropout: 0.2

loss:
  name: focal
  alpha: 1.0
  gamma: 2.0

optimizer:
  name: adamw
  lr: 1e-3
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  name: cosine_warmup
  warmup_epochs: 10
  total_epochs: 31
  min_lr: 1e-6

training:
  epochs: 31
  amp: true
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

metrics:
  task: multiclass
  num_classes: 2
  average: macro

callbacks:
  checkpoint:
    monitor: accuracy_macro
    mode: max
    save_top_k: 5
    enabled: true
  
  early_stopping:
    monitor: accuracy_macro
    mode: max
    patience: 20
    enabled: true
  
  sample_visualizer:
    num_samples: 4
    save_every_n_epochs: 5
    enabled: true
  
  confusion_matrix:
    save_every_n_epochs: 5
    enabled: true
  
  learning_rate:
    save_every_n_epochs: 5
    enabled: true
  
  accuracy_curves:
    save_every_n_epochs: 2
    enabled: true
    title: "Accuracy Progress"

transforms:
  resize: 224
  horizontal_flip: true
  vertical_flip: false
  rotation: 45
  color_jitter: true
  hue_saturation_value: true
  hue_saturation_value_hue_shift_limit: 180
  hue_saturation_value_sat_shift_limit: 128
  hue_saturation_value_val_shift_limit: 10
  hue_saturation_value_probability: 1.0
  gaussian_noise: false
  cutout: false
  grayscale: false
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  use_albumentations: true
