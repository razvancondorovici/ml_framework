# EfficientNet-B0 Classification Configuration
# Example configuration for image classification with EfficientNet-B0

experiment:
  name: efficientnet_classification
  seed: 42

data:
  dataset_type: classification
  train_data_dir: /media/andra/Extreme Pro/CerviAssistAI/sipakmed_grouped_per_subject/train
  val_data_dir: /media/andra/Extreme Pro/CerviAssistAI/sipakmed_grouped_per_subject/val
  test_data_dir: /media/andra/Extreme Pro/CerviAssistAI/sipakmed_grouped_per_subject/test
  annotations_file: /media/andra/Extreme Pro/CerviAssistAI/sipakmed_grouped_per_subject/metadata.csv
  test_config_file: configs/testing_binary_sipakmed.yaml
  num_classes: 2
  class_names: ['normal', 'suspecte']

dataloader:
  batch_size: 64
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  backbone: timm_efficientnet_b0
  pretrained: true
  freeze_backbone: true
  dropout: 0.2

loss:
  name: cross_entropy
#  alpha: 1.0
#  gamma: 2.0

optimizer:
  name: adamw
  lr: 1e-3
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  name: cosine_warmup
  warmup_epochs: 10
  total_epochs: 200
  min_lr: 1e-6

training:
  epochs: 100
  amp: true
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

metrics:
  task: binary
  num_classes: 2
  average: macro

callbacks:
  checkpoint:
    monitor: f1
    mode: max
    save_top_k: 5
    enabled: true

  early_stopping:
    monitor: f1
    mode: max
    patience: 20
    enabled: true

  sample_visualizer:
    num_samples: 20
    save_every_n_epochs: 5
    enabled: true

  confusion_matrix:
    save_every_n_epochs: 5
    enabled: true

  learning_rate:
    save_every_n_epochs: 10
    enabled: true

transforms:
  resize: 224
  horizontal_flip: true
  vertical_flip: false
  rotation: 15
  color_jitter: true
  hue_saturation_value: true
  gaussian_noise: true
  cutout: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  use_albumentations: true
