# EfficientNet-B0 Classification Configuration
# Example configuration for image classification with EfficientNet-B0

experiment:
  name: 03_train_sipakmed_val_sante
  seed: 42

data:
  dataset_type: classification
  # Can be a single directory (string) or a list of directories (will be merged)
  # Example with single directory:
  # train_data_dir: c:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\small\train
  # Example with multiple directories:
  # train_data_dir:
  #   - c:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\small\train
  #   - c:\Facultate\CerviAssist\CellsClassification\Dataset\another\dataset\train
  train_data_dir:
    - c:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\herlev_grouped\train
    # - c:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\sipakmed_grouped_per_subject\train
    # - c:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\sante_split\train
  val_data_dir:
    # - c:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\herlev_grouped\val
    # - c:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\sipakmed_grouped_per_subject\val
    - C:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\sante_split\val
  test_data_dir:  # Optional
    - c:\Facultate\CerviAssist\CellsClassification\Dataset\2025_11_03\all\herlev_grouped\test
  num_classes: 2
  class_names: ['normal', 'suspecte']


checkpoint: c:\Facultate\CerviAssist\CellsClassification\SourceCode\ml_framework\runs\05_train_herlev_sipakmed_val_herlev_sipakmed\20251104_160125\checkpoints\epoch_036_0.9862.pt

dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  backbone: timm_efficientnet_b0
  pretrained: true
  freeze_backbone: false
  dropout: 0.2

loss:
  name: focal
  alpha: 1.0
  gamma: 2.0

optimizer:
  name: adamw
  lr: 1e-3
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  name: cosine_warmup
  warmup_epochs: 10
  total_epochs: 101
  min_lr: 1e-6

training:
  epochs: 101
  amp: true
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

metrics:
  task: multiclass
  num_classes: 2
  average: macro

callbacks:
  checkpoint:
    monitor: accuracy_macro
    mode: max
    save_top_k: 5
    enabled: true
  
  early_stopping:
    monitor: accuracy_macro
    mode: max
    patience: 20
    enabled: true
  
  sample_visualizer:
    num_samples: 4
    save_every_n_epochs: 5
    enabled: true
  
  confusion_matrix:
    save_every_n_epochs: 5
    enabled: true
  
  learning_rate:
    save_every_n_epochs: 5
    enabled: true
  
  accuracy_curves:
    save_every_n_epochs: 2
    enabled: true
    title: "Accuracy Progress"

transforms:
  resize: 224
  horizontal_flip: true
  vertical_flip: false
  rotation: 15
  color_jitter: true
  hue_saturation_value: true
  gaussian_noise: true
  cutout: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  use_albumentations: true
